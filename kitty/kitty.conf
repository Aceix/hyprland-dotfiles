linux_compatible yes
cursor_trail 1
background_opacity 1.00
dynamic_background_opacity yes

allow_remote_control socket-only
listen_on unix:/tmp/mykitty

# send ctrl+tab and ctrl+shift+tab as escape sequences
map ctrl+tab send_text normal,application \x1b[9;5u
map ctrl+shift+tab send_text normal,application \x1b[9;6u

# send ctrl+shift+` as an escape sequence
map ctrl+shift+grave_accent send_text normal,application \x1b[96;6u

include themes/noctalia.conf
include vscode-keys.conf

