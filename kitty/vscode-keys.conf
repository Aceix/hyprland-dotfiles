# Hand these Ctrl+Shift keys to Neovim's VS Code layer
# (~/.config/nvim/lua/vscode_keys.lua, toggled by lua/settings.lua).
# Comment out the `include vscode-keys.conf` line in kitty.conf to give them
# back to kitty. A bare `map <key>` unmaps it so the key reaches the program.
# Kept for kitty: ctrl+shift+c/v (copy/paste), t/q (tabs), f2 (edit config).

# command palette, search, explorer, symbols, delete line, select all matches,
# problems, insert line above
map kitty_mod+p
map kitty_mod+f
map kitty_mod+e
map kitty_mod+o
map kitty_mod+k
map kitty_mod+l
map kitty_mod+m
map kitty_mod+enter
# word select (ctrl+shift+left/right), add cursor (ctrl+shift+up/down)
map kitty_mod+up
map kitty_mod+down
map kitty_mod+left
map kitty_mod+right
# restart debugging
map kitty_mod+f5
