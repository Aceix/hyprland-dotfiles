# Define your font variable at the top to prevent parsing errors
$font = Noto Sans

general {
  disable_loading_bar = true
  ignore_empty_input = true
  # 'grace' must be completely omitted from this block
}

auth {
  fingerprint:enabled = true
  fingerprint:retry_delay = 1000
}

label {
  text = Welcome, $USER
  color = rgb(ffffff)
  font_size = 40
  position = 0, 5%
  halign = center
}

label {
  text = Enter Password to login...
  color = rgb(ffffff)
  font_size = 15
  position = 0, 0
  halign = center
}

input-field {
  size = 250, 50  # Fixed: Added comma for strict parsing safety
  position = 0, -10%
  halign = center
  valign = center
  font_size = 18
  placeholder_text = Enter Password
  font_color = rgb(ffffff)
  inner_color = rgba(44, 44, 44, .2)
  outer_color = rgb(1a1a1a)
  check_color = rgb(ffffff)
  fail_color = rgb(ff3333)
  fail_text = Incorrect Password
  zindex = 1
}

# TIME
label {
  monitor =
  text = $TIME
  font_size = 90
  font_family = $font

  position = -30, 0
  halign = right
  valign = top
}

# DATE
label {
  monitor =
  text = cmd[update:60000] date +"%A, %d %B %Y"
  font_size = 25
  font_family = $font

  position = -30, -150
  halign = right
  valign = top
}

background {
  monitor =
  path = screenshot
  blur_passes = 3
}

animations {
  enabled = true
  bezier = linear, 1, 1, 0, 0
  animation = fadeIn, 1, 5, linear
  animation = fadeOut, 1, 5, linear
  animation = inputFieldDots, 1, 2, linear
}
