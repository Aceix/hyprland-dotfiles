windowrule {
  name = windowrule-27
  float = on
  match:class = ^(splash)$
}

windowrule {
  name = windowrule-28
  float = on
  match:class = ^(toolbar)$
}


# Float windows with specific window types (modal dialogs, utility windows, etc.)
windowrule {
  name = windowrule-29
  float = on
  match:xwayland = 1
  match:title = ^()$
  match:class = ^()$
}

windowrule {
  name = windowrule-30
  stay_focused = on
  min_size = 1 1
  match:title = ^()$
  match:class = ^(steam)$
}


# Make modal windows stay on top and centered

# assign telegram and spotify to workspace 1
windowrule {
  name = windowrule-31
  workspace = 1
  match:class = ^(org.telegram.desktop)$
}

windowrule {
  name = windowrule-32
  workspace = 1
  match:class = ^(telegram-desktop)$
}

windowrule {
  name = windowrule-33
  workspace = 1
  match:class = ^(Spotify)$
}

windowrule {
  name = windowrule-34
  workspace = 1
  match:class = ^(spotify)$
}


# set telegram to 1:5 ratio on the left side
windowrule {
  name = windowrule-35
  size = (monitor_w*0.16666) (monitor_h*1)
  move = (0) (0)
  match:class = ^(org.telegram.desktop)$
  match:workspace = 1
}

windowrule {
  name = windowrule-36
  size = (monitor_w*0.16666) (monitor_h*1)
  move = (0) (0)
  match:class = ^(telegram-desktop)$
  match:workspace = 1
}

# make workspaces floating

# windowrule {
#   name = floating-workspace
#
#   # Only match workspaces that are NOT workspace 1 
#   match:workspace = not:1
#
#   # Only match workspaces where special is FALSE (ignores scratchpads)
#   match:onworkspace = s[false]
#
# # match:workspace = 9
#   match:class = .*
#   float = true
#   size = 50% 40%
# }
# windowrulev2 = float, class:^(.*)$, workspace:ne(1), workspace:not:name:special
windowrule = float true, match:class .*, match:workspace not:1, match:workspace not:name:special

# only apply titlebars on floating windows
windowrule {
  name = titlebars-on-float
  match:float = 0
  # match:plugin = hyprbars:nobar
}


