# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hypr.land/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

$aocMonitor = HDMI-A-1
$dellMonitor = DP-1
$genericHdmiMonitor = HDMI-A-1

# See https://wiki.hypr.land/Configuring/Monitors/
monitor=,highres,auto,1
# monitor=,1920x1080,auto,1, mirror, HDMI-A-1
# monitor=HDMI-A-1,3440x1440,0x0,1
# monitor=Virtual-1,1920x1080,0x0,1


##############
### CONFIG ###
##############

debug {
  disable_logs = false
}


###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = nautilus
# $menu = noctalia msg panel-toggle launcher
$menu = wofi --show drun
$webBrowser = google-chrome-stable --disable-features=WaylandWpColorManagerV1
$codeEditor = code
$calculator = gnome-calculator


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = ~/.config/hypr/scripts/set_dunst_output_device.sh >> ~/.config/hypr/scripts/logs/set_dunst_output_device.log 2>&1
# exec-once = nm-applet &
exec = ~/.config/hypr/scripts/monitor_switcher.sh >> ~/.config/hypr/scripts/logs/monitor_switcher.log 2>&1
exec-once = paplay ~/.config/hypr/sounds/login.mp3 > /dev/null
exec-once = ~/.config/hypr/scripts/waybar_auto_hide &

exec-once = hypridle
exec-once = /usr/lib/hyprpolkitagent
exec-once = hyprpm reload
# exec-once = hyprpaper
exec-once = hyprsunset
exec-once = swaync
exec-once = swayosd-server
# exec = systemctl --user restart waybar.service
exec = noctalia --daemon

exec-shutdown = paplay ~/.config/hypr/sounds/login.mp3 > /dev/null

exec-once = ~/.config/hypr/scripts/startup_apps.sh >> ~/.config/hypr/scripts/logs/startup_apps.log 2>&1
exec-once = ~/.config/hypr/scripts/dnd-toggle.sh

# exec = awww-daemon
exec = ~/.config/hypr/scripts/conditional_binds.sh >> ~/.config/hypr/scripts/logs/conditional_binds.log 2>&1
exec = sleep 2 && ~/.config/hypr/scripts/random_hyprpaper.sh >> ~/.config/hypr/scripts/logs/random_hyprpaper.log 2>&1


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# DARK THEME
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"   # for GTK4 apps

exec = gsettings set org.gnome.desktop.interface gtk-theme "adw-gtk3-dark"   # for GTK3 apps

env = QT_QPA_PLATFORMTHEME,qt6ct   # for Qt apps# Theme
env = QT_QPA_PLATFORM,"wayland,xcb"

env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = ELECTRON_OZONE_PLATFORM_HINT,wayland


###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

permission = /usr/(bin|local/bin)/grim, screencopy, allow
permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
  gaps_in = 5
  gaps_out = 10

  border_size = 2

  # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
  col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
  col.inactive_border = rgba(595959aa)

  # Set to true enable resizing windows by clicking and dragging on borders and gaps
  resize_on_border = true

  # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
  allow_tearing = false

  # layout = dwindle
  layout = scrolling
  #layout = master
}

binds {
  hide_special_on_workspace_change = true
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
  rounding = 10
  rounding_power = 2

  # Change transparency of focused and unfocused windows
  active_opacity = 1.0
  inactive_opacity = .8
  fullscreen_opacity = 1

  dim_inactive = true
  dim_strength = .1

  shadow {
    enabled = false
    range = 4
    render_power = 3
    color = rgba(1a1a1aee)
  }

  # https://wiki.hypr.land/Configuring/Variables/#blur
  blur {
    enabled = true
    size = 8
    passes = 2
    brightness = 1.5

    vibrancy = 0.1696
  }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
  enabled = yes, please :)

  # Default animations, see https://wiki.hypr.land/Configuring/Animations/ for more

  bezier = easeOutQuint,0.23,1,0.32,1
  bezier = easeInOutCubic,0.65,0.05,0.36,1
  bezier = linear,0,0,1,1
  bezier = almostLinear,0.5,0.5,0.75,1.0
  bezier = quick,0.15,0,0.1,1

  animation = global, 1, 10, default
  animation = border, 1, 5.39, easeOutQuint
  animation = windows, 1, 4.79, easeOutQuint
  animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
  animation = windowsOut, 1, 1.49, linear, popin 87%
  animation = fadeIn, 1, 1.73, almostLinear
  animation = fadeOut, 1, 1.46, almostLinear
  animation = fade, 1, 3.03, quick
  animation = layers, 1, 3.81, easeOutQuint
  animation = layersIn, 1, 4, easeOutQuint, fade
  animation = layersOut, 1, 1.5, linear, fade
  animation = fadeLayersIn, 1, 1.79, almostLinear
  animation = fadeLayersOut, 1, 1.39, almostLinear
  animation = workspaces, 1, 1.94, almostLinear, fade
  animation = workspacesIn, 1, 1.21, almostLinear, fade
  animation = workspacesOut, 1, 1.94, almostLinear, fade
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]


# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
  # pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
  preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
  new_status = master
}

scrolling {
  fullscreen_on_one_column = true
  column_width = 0.8  # 0.5
  focus_fit_method = 0
  follow_focus = true
  follow_min_visible = 0.4
  explicit_column_widths = '0.333, 0.5, 0.667, 1.0'
  direction = right
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
  force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
  disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(

  vrr = 2
  #key_press_enables_dpms = true
  on_focus_under_fullscreen = 1
  exit_window_retains_fullscreen = false
  anr_missed_pings = 5 # show app not responding window if any app misses this num of pings
  focus_on_activate = true
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
  kb_layout = us
  kb_variant =
  kb_model =
  kb_options =
  kb_rules =
  numlock_by_default = true
  follow_mouse = 1 # 1 - usual behavior, 2 - GNOME behavior (without focus decoration for cursor)
  focus_on_close = 1
  sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
  touchpad {
    natural_scroll = true
    clickfinger_behavior = 1
    tap-to-click = false
    tap-and-drag = false
  }

}

cursor {
  zoom_factor = 1
  no_hardware_cursors = 1
}

# https://wiki.hypr.land/Configuring/Variables/#gestures
gestures {
  workspace_swipe_forever = false #true
  workspace_swipe_direction_lock = false
}

gesture = 3, horizontal, workspace

# Bind 3 finger swipe down to open overview
# gesture = 3, down, dispatcher, overview:close

# Bind 3 finger swipe up to close overview
# gesture = 3, up, dispatcher, overview:open

# gesture = 3, up, dispatcher, scrolloverview:overview toggle

# gesture = 3, up, dispatcher, hyprland-scroll-overview:overview, toggle


# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
  name = epic-mouse-v1
  sensitivity = -0.5
}

plugin {
  hyprmodoro {
  work_duration = 60
  rest_duration = 5

  title {
    enabled = true
    floating_window = true
  }

  border {
    enabled = true
    floating_window = true
    color = rgba(255, 0, 255, .7)
  }

  text {
    size = 8
  }

  hover {
    # text = true
    height = 5
    width = 10
    buttons = true
  }

  window {
    # padding = 10
  }

  notification {
    enabled = true
    use_system_notifications = true
    work_end = "Hyprmodoro: Work session complete"
    rest_end = "Hyprmodoro: Break over"
  }
  }
}

plugin {
  dynamic-cursors {
  enabled = true
  mode = none

  # magnifies the cursor if its is being shaken
  shake {
    # enables shake to find
    enabled = true

    # use nearest-neighbour (pixelated) scaling when shaking
    # may look weird when effects are enabled
    nearest = true

    # show cursor behaviour `tilt`, `rotate`, etc. while shaking
    effects = false

    # controls how soon a shake is detected
    # lower values mean sooner
    threshold = 6.0

    # magnification level immediately after shake start
    base = 2.0

    # magnification increase per second when continuing to shake
    speed = 4.0

    # how much the speed is influenced by the current shake intensitiy
    influence = 0.0

    # maximal magnification the cursor can reach
    # values below 1 disable the limit (e.g. 0)
    limit = 0.0

    # time in millseconds the cursor will stay magnified after a shake has ended
    timeout = 1000

    # enable ipc events for shake
    ipc = false
  }
  }
}


plugin {
  hyprbars {
    # example config
    bar_height = 20

    # example buttons (R -> L)
    # hyprbars-button = color, size, on-click
    hyprbars-button = rgb(ff4040), 10, 󰖭, hyprctl dispatch killactive
    hyprbars-button = rgb(eeee11), 10, , hyprctl dispatch fullscreen 1
  }
}

plugin {
  overview {
  # --- Layout & Positioning ---
  onBottom = true
  panelHeight = 150             # Thinner workspace bar at the bottom
  panelBorderWidth = 0          # Completely removes the panel border
  workspaceBorderSize = 0       # No visible borders around individual workspaces
  workspaceMargin = 10          # Small spacing between workspace items

  # --- Minimalist Color Theme (HEXA formats) ---
  # Deep dark/translucent background for a clean overlay look
  panelColor = rgba(15, 15, 15, 0.75) 

  # Inactive workspaces blur out or subtly blend into the panel
  workspaceBg = rgba(30, 30, 30, 0.4)

  # Active workspace is highlighted subtly without flashy accents
  workspaceActiveBg = rgba(45, 45, 45, 0.8)
  workspaceActiveBorderColor = rgba(255, 255, 255, 0.0) # Set to 0.0 transparency to hide completely

  # --- Visual Cleanliness ---
  drawActiveWorkspace = true    # Keeps context of where you currently are
  showEmptyWorkspace = false    # Hide workspaces that have no active windows 
  showNewWorkspace = false      # Hide the generic "+" workspace slot for a cleaner grid
  hideRealLayers = true         # Clean look by hiding background wallpaper/bars during overview

  # --- Behavior ---
  exitOnClick = true            # Instantly drop back to the desktop when a workspace is clicked
  exitOnSwitch = true           # Auto-close the overview interface when switching workspaces
  }
}

plugin {
  scrolloverview {
  gesture_distance = 300 # how far is the "max" for the gesture
  scale = 0.5 # preferred overview scale
  workspace_gap = 100
  layout = vertical # vertical or horizontal
  wallpaper = 0 # 0: global only, 1: per-workspace only, 2: both
  blur = false # blur only the main overview wallpaper

  shadow {
    enabled = false
    range = 50
    render_power = 3
    color = rgba(1a1a1aee)
  }
  }
}

###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, Q, killactive,
# bind = $mainMod, T, exec, $terminal
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod SHIFT, F, togglefloating
bind = $mainMod SHIFT, F, centerwindow
bind = $mainMod CTRL, F, exec, ~/.config/hypr/scripts/float_all_windows.sh
#bind = $mainMod CTRL, F, exec, hyprctl dispatch workspaceopt allfloat
bind = $mainMod, F, fullscreen, 0  # fullscreen
bind = $mainMod, M, fullscreen, 1  # maximise
# bind = $mainMod, R, exec, $menu
bind = $mainMod, R, exec, "if ! pgrep -x wofi > /dev/null; then $menu; fi"
bind = $mainMod, P, pin, # dwindle
bind = $mainMod, J, layoutmsg, togglesplit, # dwindle layout
bind = $mainMod, B, exec, $webBrowser
bind = $mainMod, V, exec, swaync-client -op
bind = $mainMod SHIFT, V, exec, $codeEditor
bind = $mainMod SHIFT, Z, exec, zeditor
bind = $mainMod, C, exec, $calculator
bind = $mainMod SHIFT, C, exec, gnome-characters
bind = $mainMod, L, exec, loginctl lock-session
bind = $mainMod SHIFT, G, execr, google-chrome-stable --new-window --app=https://gemini.google.com
bind = $mainMod SHIFT, Y, execr, google-chrome-stable --new-window --app=https://www.youtube.com
bind = $mainMod SHIFT, A, exec, antigravity

# Overview plugin
bind = SUPER, o, scrolloverview:overview, toggle

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Swap active window with another
bind = $mainMod ALT, left, swapwindow, l
bind = $mainMod ALT, right, swapwindow, r
bind = $mainMod ALT, up, swapwindow, u
bind = $mainMod ALT, down, swapwindow, d

bind = $mainMod ALT, left, layoutmsg, swapcol l
bind = $mainMod ALT, right, layoutmsg, swapcol r

# Resize active window
binde = $mainMod SHIFT, left, resizeactive, -20 0
binde = $mainMod SHIFT, right, resizeactive, 20 0
binde = $mainMod SHIFT, up, resizeactive, 0 -20
binde = $mainMod SHIFT, down, resizeactive, 0 20

# Move active window
binde = $mainMod CTRL, left, moveactive, -30 0
binde = $mainMod CTRL, right, moveactive, 30 0
binde = $mainMod CTRL, up, moveactive, 0 -30
binde = $mainMod CTRL, down, moveactive, 0 30

# Cycle through windows
# bind = ALT, TAB, exec, noctalia msg window-switcher
bind = ALT, TAB, cyclenext, visible
bind = ALT SHIFT, TAB, cyclenext, prev visible

# Move window in z-axis
bind = $mainMod, +, alterzorder, top
bind = $mainMod, -, alterzorder, bottom

# Switch between workspaces
bind = $mainMod, TAB, workspace, e+1
bind = $mainMod SHIFT, TAB, workspace, e-1
bind = $mainMod, SPACE, workspace, emptym

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod SHIFT, SPACE, movetoworkspace, emptynm
bind = $mainMod SHIFT ALT, left, movetoworkspace, -1
bind = $mainMod SHIFT ALT, right, movetoworkspace, +1

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e-1
bind = $mainMod, mouse_up, workspace, e+1

bind = $mainMod CTRL SHIFT, left, workspace, e-1
bind = $mainMod CTRL SHIFT, right, workspace, e+1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
#bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
#bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
#bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
#bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
#bindele = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 10%+
#bindele = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 10%-

bindel = ,XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = ,XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindel = ,XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindel = ,XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle
bindele = ,XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bindele = ,XF86MonBrightnessDown, exec, swayosd-client --brightness lower


# Requires playerctl
bindl = , XF86AudioNext, exec, swayosd-client --playerctl next
bindl = , XF86AudioPause, exec, swayosd-client --playerctl play-pause
bindl = , XF86AudioPlay, exec, swayosd-client --playerctl play-pause
bindl = , XF86AudioPrev, exec, swayosd-client --playerctl previous

# Screenshotting/recording
# Screenshot selected area and save to Pictures, copy to clipboard, and notify
bind = , Print, exec, grimblast copysave area && notify-send "Screenshot" "Region captured."
#bind = $mainMod, Print, exec, grimblast copysave screen && notify-send "Screenshot" "Full screen captured."
#bind = $mainMod SHIFT, Print, exec, grimblast copysave active && notify-send "Screenshot" "Active window captured."
#bind = , XF86Launch5, exec, grimblast copy area && notify-send "Screenshot" "Region copied to clipboard."

# Screen recording
bind = $mainMod, Print, exec, ~/.config/waybar/scripts/recorder.sh region >> ~/.config/waybar/scripts/logs/recorder.log 2>&1
bind = $mainMod SHIFT, Print, exec, ~/.config/waybar/scripts/recorder.sh window
bind = $mainMod ALT, Print, exec, ~/.config/waybar/scripts/recorder.sh screen
bind = $mainMod CTRL, Print, exec, ~/.config/waybar/scripts/recorder.sh stop

# Power button/Laptop lid actions. Requires acpi
bindl = , switch:Lid Switch, exec, ~/.config/hypr/scripts/laptop_switch.sh >> ~/.config/hypr/scripts/laptop_switch.log 2>&1
bindl = , switch:on:power-button, exec, ~/.config/hypr/scripts/power_button_actions.sh >> ~/.config/hypr/scripts/power_button_actions.log 2>&1


####################
### WINDOWS RULES###
####################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule {
  name = windowrule-1
  suppress_event = maximize
  persistent_size = on
  match:class = .*
}


# Fix some dragging issues with XWayland
windowrule {
  name = windowrule-2
  no_focus = on
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
  match:float = 1
  match:fullscreen = 0
  match:pin = 0
}


# Persist all floating swindow sizes across relaunches

windowrule {
  name = windowrule-3
  float = on
  match:class = ^(org.gnome.Calculator)$
}


windowrule {
  name = windowrule-4
  float = on
  match:class = ^(kitty)$
  match:title = ^SystemUpdater$
}


windowrule {
  name = windowrule-5
  float = on
  size = 570 390
  move = (cursor_x+(16)) (cursor_y+(16))
  match:class = ^org.gnome.Characters$
}


# Float all modal dialogs and file selectors
windowrule {
  name = windowrule-6
  float = on
  stay_focused = on
  match:modal = 1
}

windowrule {
